[project]
name = "questionpulse-backend"
version = "0.1.0"
description = "QuestionPulse FastAPI backend"
requires-python = ">=3.11,<3.13"
dependencies = [
  "aiofiles>=24,<25",
  "alembic>=1.14,<2",
  "asyncmy>=0.2.10,<1",
  "fastapi>=0.115,<1",
  "fastembed>=0.4,<1",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.7,<3",
  "pymysql>=1.1,<2",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "python-multipart>=0.0.20,<1",
  "python-pptx>=1.0,<2",
  "qdrant-client>=1.12,<2",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
  "aiosqlite>=0.20,<1",
  "numpy>=2.1,<3",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1",
  "scikit-learn>=1.6,<2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

